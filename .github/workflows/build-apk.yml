name: Build FizLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir appsrc
          unzip FizLab_GitHub_APK_Builder.zip -d appsrc

      - name: Build APK
        run: cd appsrc && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FizLab-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
